
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#10152b;color:#f4f6ff;font-family:Arial,sans-serif}
.app{max-width:1000px;margin:auto}
header{text-align:center;margin:10px 0 20px}
header h1{font-size:32px;color:#b7f36b;margin:5px}
header p{color:#b9c2e7}
.layout{display:grid;grid-template-columns:minmax(0,600px) minmax(230px,1fr);gap:16px}
.panel{background:#1b2342;border:1px solid #3c497a;border-radius:16px;padding:14px;min-width:0}
.board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;border:4px solid #303b67;border-radius:8px;overflow:hidden}
.square{position:relative;display:grid;place-items:center;padding:0;border:0;aspect-ratio:1;cursor:pointer;touch-action:manipulation}
.light{background:#f3e8d0}
.dark{background:#6979c6}
.selected{box-shadow:inset 0 0 0 4px #b7f36b}
.piece{font-family:"Segoe UI Symbol","DejaVu Sans",serif;font-size:clamp(23px,6vw,55px);line-height:1;pointer-events:none}
.white{color:white;text-shadow:1px 1px 2px #222,-1px -1px 2px #222}
.black{color:#171b2b;text-shadow:0 1px 1px white}
.dot{position:absolute;width:23%;height:23%;border-radius:50%;background:#16845d99}
.capture{position:absolute;inset:5%;border:4px solid #16845d99;border-radius:50%}
h2{font-size:20px}
label{display:block;color:#b9c2e7;font-size:13px;margin:12px 0 6px}
select,button{width:100%;padding:11px;border-radius:9px;font-size:15px}
select{background:#111832;color:white;border:1px solid #46558a}
button{border:0;background:#344270;color:white;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
.primary{background:#7658ed}
.green{background:#b7f36b;color:#15202b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.status{padding:12px;background:#111832;border-radius:10px;margin-top:14px;line-height:1.5}
#status{font-weight:bold}
#history{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:150px;overflow:auto}
.move{background:#303c69;padding:6px;border-radius:5px;font-size:13px}
#promotion{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
#promotion.show{display:grid}
#promotion button{font-size:25px}
.note{font-size:12px;color:#b9c2e7;line-height:1.6}
@media(max-width:720px){
 body{padding:8px}
 .layout{grid-template-columns:1fr}
 .panel{padding:10px}
 header h1{font-size:27px}
 .piece{font-size:clamp(27px,10vw,52px)}
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>♞ CHESS ARENA</h1>
<p>Play against Robot or a Friend</p>
</header>

<div class="layout">
<section class="panel">
<div id="board" class="board"></div>
<div id="promotion"></div>
<div class="status">
<div id="status">White to move</div>
<div id="message" class="note">Select a piece, then tap a highlighted square.</div>
</div>
</section>

<aside class="panel">
<h2>Game Settings</h2>
<label for="mode">Game Mode</label>
<select id="mode">
<option value="robot">Human vs Robot</option>
<option value="human">Human vs Human</option>
</select>

<label for="difficulty">Robot Difficulty</label>
<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
</select>

<div class="actions">
<button class="primary" id="new">New Game</button>
<button id="restart">Restart</button>
<button id="undo">Undo Move</button>
<button class="green" id="hint">Best Move</button>
</div>

<h2>Move History</h2>
<div id="history"><span class="note">No moves yet.</span></div>
<p class="note">Includes legal moves, castling, en passant, pawn promotion, check, checkmate, stalemate and draw detection.</p>
</aside>
</div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const files = "abcdefgh";
const glyph = {
 K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",
 k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"
};
const dirs = {
 n:[-33,-31,-18,-14,14,18,31,33],
 b:[-17,-15,15,17],
 r:[-16,-1,1,16],
 q:[-17,-16,-15,-1,1,15,16,17],
 k:[-17,-16,-15,-1,1,15,16,17]
};
const on = i => i >= 0 && i < 128 && !(i & 0x88);
const side = p => !p || p==="." ? 0 : p===p.toUpperCase()?1:-1;
const sq = i => files[i&7] + (8-(i>>4));

function startState(){
 const b=Array(128).fill(".");
 const rows=[
  "rnbqkbnr","pppppppp","........","........",
  "........","........","PPPPPPPP","RNBQKBNR"
 ];
 rows.forEach((r,y)=>[...r].forEach((p,x)=>b[y*16+x]=p));
 return {b,t:1,c:15,ep:-1,half:0,full:1};
}
function clone(s){
 return {...s,b:s.b.slice()};
}
function attacked(s,target,by){
 for(let f=0;f<128;f++){
  if(!on(f)||side(s.b[f])!==by)continue;
  const p=s.b[f].toLowerCase();
  if(p==="p"){
   if(target===f-16*by-1||target===f-16*by+1)return true;
   continue;
  }
  for(const d of dirs[p]||dirs.k){
   for(let t=f+d;on(t);t+=d){
    if(t===target)return true;
    if(s.b[t]!=="."||p==="n"||p==="k")break;
   }
  }
 }
 return false;
}
function inCheck(s,color=s.t){
 return attacked(s,s.b.indexOf(color===1?"K":"k"),-color);
}
function apply(s,m){
 const [f,t,promo,flag]=m;
 const b=s.b.slice(),piece=b[f],captured=b[t];
 let c=s.c;
 b[f]=".";
 b[t]=promo?(s.t===1?promo.toUpperCase():promo):piece;
 if(flag==="ep")b[t+16*s.t]=".";
 if(flag==="castle"){
  const rf=t>f?f+3:f-4,rt=t>f?f+1:f-1;
  b[rt]=b[rf];b[rf]=".";
 }
 if(piece==="K")c&=~3;
 if(piece==="k")c&=~12;
 const rb={119:1,112:2,7:4,0:8};
 if(piece.toLowerCase()==="r")c&=~(rb[f]||0);
 if(captured.toLowerCase()==="r")c&=~(rb[t]||0);
 return {
  b,t:-s.t,c,
  ep:piece.toLowerCase()==="p"&&Math.abs(t-f)===32?(t+f)/2:-1,
  half:piece.toLowerCase()==="p"||captured!=="."||flag==="ep"?0:s.half+1,
  full:s.full+(s.t===-1?1:0)
 };
}
function pseudo(s){
 const out=[];
 for(let f=0;f<128;f++){
  if(!on(f)||side(s.b[f])!==s.t)continue;
  const p=s.b[f].toLowerCase();
  const add=(t,flag="")=>{
   if(s.b[t].toLowerCase()==="k")return;
   if(p==="p"&&(t>>4===0||t>>4===7)){
    for(const q of ["q","r","b","n"])out.push([f,t,q,flag]);
   }else out.push([f,t,"",flag]);
  };
  if(p==="p"){
   const t=f-16*s.t;
   if(on(t)&&s.b[t]==="."){
    add(t);
    const u=t-16*s.t;
    if((s.t===1?(f>>4)===6:(f>>4)===1)&&s.b[u]===".")add(u);
   }
   for(const d of [-1,1]){
    const u=t+d;
    if(!on(u))continue;
    if(side(s.b[u])===-s.t)add(u);
    else if(u===s.ep&&s.b[u]==="."&&s.b[u+16*s.t]===(s.t===1?"p":"P"))add(u,"ep");
   }
  }else{
   for(const d of dirs[p]||dirs.k){
    for(let t=f+d;on(t);t+=d){
     if(side(s.b[t])===s.t)break;
     add(t);
     if(s.b[t]!=="."||p==="n"||p==="k")break;
    }
   }
   const home=s.t===1?116:4;
   const rook=s.t===1?"R":"r";
   const bits=s.t===1?[1,2]:[4,8];
   if(p==="k"&&f===home&&!inCheck(s)){
    if((s.c&bits[0])&&s.b[f+3]===rook&&
       s.b[f+1]==="."&&s.b[f+2]==="."&&
       !attacked(s,f+1,-s.t)&&!attacked(s,f+2,-s.t))add(f+2,"castle");
    if((s.c&bits[1])&&s.b[f-4]===rook&&
       s.b[f-1]==="."&&s.b[f-2]==="."&&s.b[f-3]==="."&&
       !attacked(s,f-1,-s.t)&&!attacked(s,f-2,-s.t))add(f-2,"castle");
   }
  }
 }
 return out;
}
function legal(s){
 return pseudo(s).filter(m=>!inCheck(apply(s,m),s.t));
}
function san(s,m){
 const [f,t,promo,flag]=m;
 const p=s.b[f].toUpperCase();
 const capture=s.b[t]!=="."||flag==="ep";
 let out="";
 if(flag==="castle")out=t>f?"O-O":"O-O-O";
 else{
  if(p!=="P"){
   out=p;
   const others=legal(s).filter(x=>x[0]!==f&&x[1]===t&&s.b[x[0]]===s.b[f]);
   if(others.length){
    out+=!others.some(x=>(x[0]&7)===(f&7))?sq(f)[0]:
     !others.some(x=>(x[0]>>4)===(f>>4))?sq(f)[1]:sq(f);
   }
  }else if(capture)out=sq(f)[0];
  out+=(capture?"x":"")+sq(t)+(promo?"="+promo.toUpperCase():"");
 }
 const n=apply(s,m);
 return out+(inCheck(n)?legal(n).length?"+":"#":"");
}
function positionKey(s){
 return s.b.join("")+":"+s.t+":"+s.c+":"+
  (s.ep>=0&&legal(s).some(m=>m[3]==="ep")?s.ep:-1);
}
function insufficient(s){
 const ps=[];
 for(let i=0;i<128;i++){
  if(on(i)&&s.b[i]!=="."&&!["k","K"].includes(s.b[i]))
   ps.push([s.b[i].toLowerCase(),((i>>4)+(i&7))%2]);
 }
 return ps.length===0||
  (ps.length===1&&["b","n"].includes(ps[0][0]))||
  (ps.every(p=>p[0]==="b")&&new Set(ps.map(p=>p[1])).size===1);
}
function getStatus(){
 const s=state,ms=legal(s),check=inCheck(s);
 const key=positionKey(s);
 const repetitions=history.filter(h=>positionKey(h.s)===key).length;
 if(!ms.length)return {done:true,text:check?
  "Checkmate! "+(s.t===1?"Black":"White")+" wins.":"Draw by stalemate."};
 if(insufficient(s))return {done:true,text:"Draw by insufficient material."};
 if(s.half>=150||repetitions>=5)return {done:true,text:"Draw by "+
  (s.half>=150?"75-move rule.":"fivefold repetition.")};
 return {done:false,text:(s.t===1?"White":"Black")+" to move"+(check?" · CHECK":"")};
}

let state=startState();
let history=[{s:clone(state),m:null,notation:""}];
let selected=-1,pending=null,lastMove=null,thinking=false;

function humanTurn(){
 return $("mode").value==="human"||state.t===1;
}
function render(){
 const board=$("board");
 board.innerHTML="";
 const moves=legal(state);
 const targets=selected<0?[]:moves.filter(m=>m[0]===selected).map(m=>m[1]);
 const st=getStatus();

 for(let r=0;r<8;r++)for(let c=0;c<8;c++){
  const i=r*16+c;
  const btn=document.createElement("button");
  btn.className="square "+((r+c)%2===0?"light":"dark");
  btn.setAttribute("aria-label",sq(i));
  if(selected===i)btn.classList.add("selected");
  if(lastMove&&(lastMove[0]===i||lastMove[1]===i))
   btn.style.background="#d2df75";

  const p=state.b[i];
  if(p!=="."){
   const sp=document.createElement("span");
   sp.className="piece "+(side(p)===1?"white":"black");
   sp.textContent=glyph[p];
   btn.appendChild(sp);
  }
  if(targets.includes(i)){
   const mark=document.createElement("span");
   mark.className=state.b[i]==="."?"dot":"capture";
   btn.appendChild(mark);
  }
  btn.disabled=thinking||!humanTurn()||st.done;
  btn.addEventListener("click",()=>clickSquare(i));
  board.appendChild(btn);
 }

 $("status").textContent=thinking?"Robot is thinking…":st.text;
 $("message").textContent=thinking?"Choosing a move":
  st.done?"Game over. Start a new game to play again.":
  "Select a piece, then tap a highlighted square.";
 $("difficulty").disabled=$("mode").value!=="robot";
 $("undo").disabled=history.length<=1||thinking;
 $("hint").disabled=thinking||st.done;
 drawHistory();
 renderPromotion();

 if(!thinking&&!st.done&&$("mode").value==="robot"&&state.t===-1)
  setTimeout(robotMove,100);
}
function drawHistory(){
 const el=$("history");
 el.innerHTML="";
 if(history.length===1){
  el.textContent="No moves yet.";
  return;
 }
 for(let n=1;n<history.length;n++){
  const span=document.createElement("span");
  span.className="move";
  span.textContent=(n%2?Math.ceil(n/2)+". ":"")+history[n].notation;
  el.appendChild(span);
 }
 el.scrollTop=el.scrollHeight;
}
function renderPromotion(){
 const el=$("promotion");
 el.innerHTML="";
 el.classList.toggle("show",!!pending);
 if(!pending)return;
 for(const p of ["q","r","b","n"]){
  const btn=document.createElement("button");
  btn.textContent=glyph[state.t===1?p.toUpperCase():p];
  btn.title={q:"Queen",r:"Rook",b:"Bishop",n:"Knight"}[p];
  btn.onclick=()=>commit(pending.find(m=>m[2]===p));
  el.appendChild(btn);
 }
}
function clickSquare(i){
 if(thinking||!humanTurn()||getStatus().done||pending)return;
 if(selected>=0){
  const opts=legal(state).filter(m=>m[0]===selected&&m[1]===i);
  if(opts.length){
   if(opts.length>1){
    pending=opts;
    renderPromotion();
    return;
   }
   commit(opts[0]);
   return;
  }
 }
 if(side(state.b[i])===state.t){
  selected=i;
 }else selected=-1;
 render();
}
function commit(m){
 if(!m)return;
 const notation=san(state,m);
 const next=apply(state,m);
 history.push({s:clone(next),m:m.slice(),notation});
 state=next;
 lastMove=[m[0],m[1]];
 selected=-1;
 pending=null;
 render();
}
function robotMove(){
 if(thinking||$("mode").value!=="robot"||state.t!==-1||getStatus().done)return;
 thinking=true;
 render();
 setTimeout(()=>{
  const ms=legal(state);
  if(!ms.length){thinking=false;render();return;}
  const depth=$("difficulty").value==="easy"?1:
   $("difficulty").value==="medium"?2:3;
  const chosen=chooseMove(state,ms,depth);
  thinking=false;
  commit(chosen);
 },30);
}

const values={p:100,n:320,b:330,r:500,q:900,k:20000};
function evaluate(s){
 let score=0;
 for(let i=0;i<128;i++){
  if(!on(i))continue;
  const p=s.b[i];
  if(p===".")continue;
  const color=side(p),type=p.toLowerCase();
  let v=values[type];
  const rank=7-(i>>4),file=i&7;
  const center=7-(Math.abs(file*2-7)+Math.abs(rank*2-7))/2;
  if(type==="p")v+=rank*7+center*2;
  if(type==="n"||type==="b")v+=center*(type==="n"?8:4);
  if(type==="r"&&rank===6)v+=18;
  score+=color*v;
 }
 return score;
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function chooseMove(s,moves,depth){
 const maximizing=s.t===1;
 let best=maximizing?-Infinity:Infinity,choices=[];
 for(const m of shuffle(moves.slice())){
  const val=minimax(apply(s,m),depth-1,-Infinity,Infinity);
  if(maximizing?val>best:val<best){
   best=val;choices=[m];
  }else if(Math.abs(val-best)<.01)choices.push(m);
 }
 return choices[Math.floor(Math.random()*choices.length)];
}
function minimax(s,depth,alpha,beta){
 const moves=legal(s);
 if(!moves.length)return inCheck(s)?(s.t===-1?-100000:100000):0;
 if(insufficient(s))return 0;
 if(depth<=0)return evaluate(s);
 const maximizing=s.t===1;
 let best=maximizing?-Infinity:Infinity;
 for(const m of shuffle(moves)){
  const v=minimax(apply(s,m),depth-1,alpha,beta);
  if(maximizing){
   best=Math.max(best,v);
   alpha=Math.max(alpha,best);
  }else{
   best=Math.min(best,v);
   beta=Math.min(beta,best);
  }
  if(beta<=alpha)break;
 }
 return best;
}
function reset(){
 state=startState();
 history=[{s:clone(state),m:null,notation:""}];
 selected=-1;
 pending=null;
 lastMove=null;
 thinking=false;
 render();
}
$("new").onclick=reset;
$("restart").onclick=reset;
$("mode").onchange=reset;
$("difficulty").onchange=()=>render();
$("undo").onclick=()=>{
 if(history.length<=1||thinking)return;
 const count=$("mode").value==="robot"&&history.length>2?2:1;
 history.splice(-count,count);
 state=clone(history[history.length-1].s);
 const m=history[history.length-1].m;
 lastMove=m?[m[0],m[1]]:null;
 selected=-1;
 pending=null;
 render();
};
$("hint").onclick=()=>{
 if(thinking||getStatus().done)return;
 const m=chooseMove(state,legal(state),2);
 selected=m[0];
 render();
 $("message").textContent="Suggested move: "+sq(m[0])+" → "+sq(m[1]);
};
render();
})();
</script>
</body>
</html>
